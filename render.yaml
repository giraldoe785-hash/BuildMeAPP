# ==============================================================================
# BuildMeAPP — Render Blueprint Specification (Free Tier)
# ==============================================================================
# Documentación oficial: https://render.com/docs/blueprint-spec
# Presupuesto: USD 0 mensual (Plan Free en todas las capas)
# Base de datos: Externa administrada en Neon PostgreSQL Free (sin costo)
# Almacenamiento: Supabase Storage Free (1 GB almacenamiento, 5 GB egress, USD 0)
# Correo: Resend HTTPS API Free (sin costo dentro de cuota)
# Pagos: Wompi Sandbox exclusivamente (sin cobros reales)
# ==============================================================================

services:
  - type: web
    name: buildmeapp-demo
    runtime: docker
    plan: free
    region: virginia
    branch: deploy/render-free-7593392
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon PostgreSQL (cadena pooled con pgbouncer y sslmode=require para runtime)
      - key: DATABASE_URL
        sync: false
      # Neon PostgreSQL (conexión directa para Prisma CLI y migraciones)
      - key: DIRECT_URL
        sync: false
      # Autenticación y sesiones (generar con: openssl rand -hex 32)
      - key: AUTH_SECRET
        sync: false
      # URL pública HTTPS provista por Render (ej: https://buildmeapp-demo.onrender.com)
      - key: APP_BASE_URL
        sync: false
      # Almacenamiento privado Supabase Storage (Free Tier - USD 0)
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      # Clave secreta privada (SUPABASE_SECRET_KEY) exclusiva del backend - NUNCA pública
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: buildmeapp-private-documents
      # Correo transaccional mediante Resend HTTPS API (sin puertos SMTP)
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Pasarela de pagos Wompi Colombia (exclusivamente Sandbox / Pruebas)
      - key: WOMPI_ENVIRONMENT
        value: test
      - key: NEXT_PUBLIC_WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_API_URL
        value: https://sandbox.wompi.co/v1
      # Opciones de interfaz para demostración
      - key: NEXT_PUBLIC_SHOW_DEMO_LOGIN
        value: "true"
